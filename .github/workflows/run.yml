name: "FXmetrics - Génération du dashboard"

on:
  workflow_dispatch: {}
  # Décommente ces lignes pour automatiser (voir README) :
  # schedule:
  #   - cron: "0 7 * * 1-5"   # 07h00 UTC, du lundi au vendredi

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Génère le dashboard + journal
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python scripts/fxmetrics.py

      - name: Commit le dashboard et le journal
        run: |
          git config user.name "fxmetrics-bot"
          git config user.email "fxmetrics-bot@users.noreply.github.com"
          git add docs/ data/
          git diff --cached --quiet || git commit -m "FXmetrics: run $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
