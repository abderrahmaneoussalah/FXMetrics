name: "1 - Ajouter une zone d'alerte"

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Instrument (seulement ceux scannés par FXmetrics)"
        type: choice
        required: true
        default: "EUR/USD (EURUSD=X)"
        options:
          - "EUR/USD (EURUSD=X)"
          - "GBP/USD (GBPUSD=X)"
          - "USD/JPY (JPY=X)"
          - "AUD/USD (AUDUSD=X)"
          - "USD/CAD (CAD=X)"
          - "USD/CHF (CHF=X)"
          - "USD/NOK (NOK=X)"
          - "NZD/USD (NZDUSD=X)"
          - "EUR/GBP (EURGBP=X)"
          - "EUR/JPY (EURJPY=X)"
          - "GBP/JPY (GBPJPY=X)"
          - "AUD/JPY (AUDJPY=X)"
          - "AUD/NZD (AUDNZD=X)"
          - "EUR/CHF (EURCHF=X)"
          - "EUR/CAD (EURCAD=X)"
          - "GBP/CAD (GBPCAD=X)"
          - "USD/MXN (USDMXN=X)"
          - "USD/BRL (USDBRL=X)"
          - "USD/ZAR (USDZAR=X)"
          - "USD/SEK (USDSEK=X)"
          - "USD/SGD (USDSGD=X)"
          - "USD/PLN (USDPLN=X)"
          - "USD/INR (USDINR=X)"
          - "USD/HUF (USDHUF=X)"
          - "S&P 500 (^GSPC)"
          - "Nasdaq 100 (^NDX)"
          - "Dow Jones (^DJI)"
          - "DAX 40 (^GDAXI)"
          - "FTSE 100 (^FTSE)"
          - "Nikkei 225 (^N225)"
          - "Or (GC=F)"
          - "Argent (SI=F)"
          - "Cuivre (HG=F)"
          - "Platine (PL=F)"
          - "WTI (CL=F)"
          - "Brent (BZ=F)"
          - "Gaz nat. (NG=F)"
      level:
        description: "Niveau de prix (ex: 1.0850)"
        type: string
        required: true
      tolerance:
        description: "Tolérance autour du niveau (optionnel, défaut = 0.1% du niveau)"
        type: string
        default: ""
      note:
        description: "Note (optionnel, ex: Résistance hebdo)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Ajouter la zone
        env:
          ALERT_TICKER: ${{ github.event.inputs.ticker }}
          ALERT_LEVEL: ${{ github.event.inputs.level }}
          ALERT_TOLERANCE: ${{ github.event.inputs.tolerance }}
          ALERT_NOTE: ${{ github.event.inputs.note }}
        run: python scripts/add_alert.py
      - name: Commit
        run: |
          git config user.name "price-alerts-bot"
          git config user.email "price-alerts-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Ajout zone: ${{ github.event.inputs.ticker }} @ ${{ github.event.inputs.level }}"
          git push
