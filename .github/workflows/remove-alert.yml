name: "2 - Supprimer une zone d'alerte"

on:
  workflow_dispatch:
    inputs:
      id:
        description: "Numéro de la zone à supprimer, SANS le # (ex: 1). Vois les numéros via le workflow '3 - Lister les zones'."
        type: string
        required: true

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Supprimer la zone
        env:
          ALERT_ID: ${{ github.event.inputs.id }}
        run: python scripts/remove_alert.py
      - name: Commit
        run: |
          git config user.name "price-alerts-bot"
          git config user.email "price-alerts-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Suppression zone #${{ github.event.inputs.id }}"
          git push
