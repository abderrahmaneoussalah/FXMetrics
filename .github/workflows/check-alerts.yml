name: "4 - Vérifier les zones (auto)"

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 * * * *"   # toutes les 15 minutes, 24h/24 (ajuste si besoin, voir README)

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Vérifier les zones
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/check_alerts.py
      - name: Commit l'état (prix vus, zones déclenchées)
        run: |
          git config user.name "price-alerts-bot"
          git config user.email "price-alerts-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Check: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
